name: "INDEPENDENT Paper 1 source-to-model reproduction October 2026"
on:
  push:
    branches:
      - research/independent-paper1-reproduction-20261028
    paths:
      - verification/independent_paper1_2015.py
      - .github/workflows/independent-paper1-reproduction-20261028.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recorded reproducibility dependencies
        run: |
          python -m pip install -r requirements-repro.txt
          python -m pip install 'gdown>=5.2,<6'
      - name: Syntax and source independence preflight
        run: |
          python -m py_compile verification/independent_paper1_2015.py
          python - <<'PY'
          from pathlib import Path
          src=Path('verification/independent_paper1_2015.py').read_text()
          assert 'import run_experiment' not in src
          assert 'import robustness_extension' not in src
          assert 'from knowledge_tracing_benchmark' not in src
          print('PASS: reimplementation is standalone and does not call research model modules')
          PY
      - name: Independently download, rederive and refit both history budgets
        run: python -u verification/independent_paper1_2015.py
      - name: Save independent aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-2026-independent-source-to-model-evidence
          path: results/independent_paper1_2015_20261028.json
          if-no-files-found: warn
      - name: Commit aggregate evidence for independent inspection
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/independent_paper1_2015_20261028.json
          if ! git diff --cached --quiet; then
            git commit -m 'verification: archive independent 2015 source-to-model outputs'
            git push origin HEAD:research/independent-paper1-reproduction-20261028
          fi
