name: CI
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements.txt", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "requirements.txt", "pyproject.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: PYTHONPATH=src python -m pytest -q

  empirical-arxiv-check:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/kt-arxiv-verification-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install reproducibility environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-repro.txt
          pip install pytest
      - name: Rerun original experiment with real ASSISTments mirror
        run: PYTHONPATH=src python src/run_experiment.py
      - name: Execute extended GRU and richer PFA robustness
        run: PYTHONPATH=src python scripts/robustness_extension.py --epochs 25 --patience 4 --boots 2000 --seeds 13 42 73
      - name: Validate outputs against real-data identifiers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("results/metrics.json").read_text())
          extension=json.loads(Path("results/robustness_extension.json").read_text())
          assert original["dataset"]["n_learners"]==extension["dataset"]["n_learners"]==4148
          assert original["dataset"]["n_interactions"]==extension["dataset"]["n_interactions"]==274331
          assert original["dataset"]["parquet_sha256"]==extension["dataset"]["parquet_sha256"]
          assert extension["status"]=="complete_exploratory_real_data"
          assert len(extension["extended_gru"])==3
          for run in extension["extended_gru"].values():
              assert run["paired_vs_pfa"]["n_learners"]==623
              assert run["paired_vs_stronger_pfa"]["n_interactions"]==41228
          print("Original + robustness real-data results: numerical validation passed")
          PY
      - name: Upload numerical evidence for manuscript update
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistments-arxiv-reproduction
          path: |
            results/metrics.json
            results/summary.md
            results/robustness_extension.json
            results/figures/
          if-no-files-found: warn
