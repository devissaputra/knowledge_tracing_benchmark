name: External cohort confirmation — ASSISTments 2015
on:
  push:
    branches:
      - research/kt-fresh-cohort-20261022
    paths:
      - scripts/confirmatory_2015.py
      - .github/workflows/confirmatory-2015.yml
      - CONFIRMATORY_PROTOCOL_2015.md
      - scripts/robustness_extension.py
      - src/run_experiment.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  external-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verified environment and Google Drive downloader
        run: |
          python -m pip install -r requirements-repro.txt
          python -m pip install 'gdown>=5.2,<6' pytest
      - name: Compile frozen confirmatory analysis
        run: |
          python -m py_compile scripts/confirmatory_2015.py
      - name: Run independent-cohort analysis
        run: PYTHONPATH=src python scripts/confirmatory_2015.py
      - name: Validate output schema and data isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('results/confirmatory_assist2015.json').read_text())
          assert a['protocol']['sample_learners'] == 5000
          assert sum(a['protocol'][k] for k in ('train_learners','validation_learners','test_learners')) == 5000
          assert a['brier_comparison']['n_learners'] == a['protocol']['test_learners']
          assert a['brier_comparison']['n_bootstrap'] == 2000
          assert len(a['data']['source_sha256']) == 64
          print('External-cohort result recorded. Confirmation:', a['directional_replication_confirmed'])
          PY
      - name: Upload results and logs even if run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-tracing-2015-confirmation
          path: results/confirmatory_assist2015.json
          if-no-files-found: warn
      - name: Commit metrics to branch without changing previous paper results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/confirmatory_assist2015.json
          if ! git diff --cached --quiet; then
            git commit -m "research: freeze ASSISTments 2015 external-cohort test outcome"
            git push origin HEAD:research/kt-fresh-cohort-20261022
          fi