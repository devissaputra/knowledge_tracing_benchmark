<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Knowledge Tracing Benchmark architecture</title>
<desc id="desc">ASSISTments sequences are learner-disjointly partitioned, compared across six model families, and evaluated with probability, calibration, slice, uncertainty, and error diagnostics.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="360" rx="24" fill="#f8fafc"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Knowledge Tracing Benchmark · empirical architecture</text>
<text x="52" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Pinned real data → learner-disjoint protocol → transparent and recurrent comparators → held-out evidence</text>

<rect x="45" y="122" width="200" height="118" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="145" y="157" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">ASSISTments 2009</text>
<text x="145" y="184" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Pinned revision + SHA-256</text>
<text x="145" y="208" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Unique learner rows</text>

<line x1="255" y1="181" x2="315" y2="181" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="325" y="122" width="220" height="118" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="435" y="155" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Learner-disjoint split</text>
<text x="435" y="181" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">70% train · 15% validation</text>
<text x="435" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">15% final test · seed 42</text>

<line x1="555" y1="181" x2="615" y2="181" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="625" y="106" width="250" height="150" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="750" y="140" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Six comparators</text>
<text x="750" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Global + skill priors</text>
<text x="750" y="192" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Fixed + tuned BKT</text>
<text x="750" y="216" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">PFA-style logistic + GRU</text>
<text x="750" y="240" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748b">GRU seeds 13 · 42 · 73</text>

<line x1="885" y1="181" x2="945" y2="181" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="955" y="106" width="205" height="150" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="1057" y="140" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Held-out evidence</text>
<text x="1057" y="168" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">AUC · AP · Brier</text>
<text x="1057" y="191" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Log loss · ECE-10</text>
<text x="1057" y="214" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Learner-block bootstrap</text>
<text x="1057" y="237" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Slices + error analysis</text>

<text x="52" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Predictions are emitted before the current response is observed. The final test partition is not used for model selection.</text>
</svg>