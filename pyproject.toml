[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-tracing-benchmark"
version = "0.2.0"
description = "Learner-disjoint ASSISTments 2009 benchmark comparing priors, BKT, PFA, and a compact GRU knowledge tracer."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = ["ai-in-education", "aied", "knowledge-tracing", "learner-modeling", "learning-analytics", "bayesian-knowledge-tracing", "performance-factors-analysis", "gru"]

[project.urls]
Repository = "https://github.com/devissaputra/knowledge_tracing_benchmark"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
